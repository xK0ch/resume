events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL is terminated by the fynn-koch-landingpage reverse proxy in front of
    # this container, which forwards plain HTTP to port 80.
    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

        # Serve the PDFs inline so the browser preview works; long cache since a
        # new resume ships as a new image build.
        location ~* \.pdf$ {
            add_header Content-Disposition "inline";
            expires 1h;
            add_header Cache-Control "public";
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
